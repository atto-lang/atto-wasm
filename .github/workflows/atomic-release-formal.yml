name: Bounded atomic artifact publication model checking
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tlc-artifact-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pristine Git checkout and record complete tree identity
        shell: bash
        run: bash scripts/verify-source-tree.sh
      - name: Fetch immutable SHA-pinned TLA+ TLC 1.8.0 tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 -o /tmp/tla2tools.jar \
            https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar
          echo "ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  /tmp/tla2tools.jar" | sha256sum -c
      - name: Prove positive two-publisher safety invariants with TLC
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicRelease.cfg formal/AtomicRelease.tla
      - name: Negative model must produce a partial-publication counterexample
        shell: bash
        run: |
          set -euo pipefail
          if java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicReleaseUnsafe.cfg formal/AtomicRelease.tla > /tmp/unsafe-tlc.log 2>&1; then
            echo "UNSAFE model unexpectedly passed"; cat /tmp/unsafe-tlc.log; exit 1
          fi
          grep -q "Invariant NoPartialPointer is violated" /tmp/unsafe-tlc.log || { cat /tmp/unsafe-tlc.log; exit 1; }
          echo "PASS: deliberate pre-verify pointer mutation produced TLC safety counterexample"
      - name: Verify durable pointer and pinned-reader retention after crash
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicRecovery.cfg formal/AtomicRecovery.tla
      - name: Unsafe removal of a release held by a reader must fail
        shell: bash
        run: |
          set -euo pipefail
          if java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicRecoveryUnsafe.cfg formal/AtomicRecovery.tla > /tmp/unsafe-recovery.log 2>&1; then
            echo "UNSAFE reader model unexpectedly passed"; cat /tmp/unsafe-recovery.log; exit 1
          fi
          grep -q "Invariant ReaderPinnedReleasePresent is violated" /tmp/unsafe-recovery.log || { cat /tmp/unsafe-recovery.log; exit 1; }
          echo "PASS: unsafe garbage collection of reader-pinned release violated TLC invariant"

      - name: Model commit outcome when pointer rename precedes durability confirmation
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicCommitOutcome.cfg formal/AtomicCommitOutcome.tla
      - name: Unsafe replay of an uncertain commit must violate invariant
        shell: bash
        run: |
          set -euo pipefail
          if java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicCommitOutcomeUnsafe.cfg formal/AtomicCommitOutcome.tla > /tmp/unsafe-outcome.log 2>&1; then
            echo "Unsafe replay model unexpectedly passed"; cat /tmp/unsafe-outcome.log; exit 1
          fi
          grep -q "Invariant NoBlindReplay is violated" /tmp/unsafe-outcome.log || { cat /tmp/unsafe-outcome.log; exit 1; }
          echo "PASS: blind replay after uncertain post-rename fsync rejected by TLC"

      - name: Bound three writers, two live/suspect reader pins and retention
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/RetentionLeases.cfg formal/RetentionLeases.tla
      - name: Reject unfenced lease expiry collection with TLC counterexample
        shell: bash
        run: |
          set -euo pipefail
          if java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/RetentionLeasesUnsafe.cfg formal/RetentionLeases.tla > /tmp/unsafe-retention.log 2>&1; then
            echo "Unfenced GC model unexpectedly passed"; cat /tmp/unsafe-retention.log; exit 1
          fi
          grep -q "Invariant PinnedPresent is violated" /tmp/unsafe-retention.log || { cat /tmp/unsafe-retention.log; exit 1; }
          echo "PASS: expired but unfenced reader pin blocks release reclamation"
      - name: Prove retirement closes read admission before reclamation
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicReaderRetention.cfg formal/AtomicReaderRetention.tla
      - name: Reject collection of an already pinned retired identity
        shell: bash
        run: |
          set -euo pipefail
          if java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 -deadlock -cleanup -config formal/AtomicReaderRetentionUnsafe.cfg formal/AtomicReaderRetention.tla > /tmp/unsafe-retired.log 2>&1; then
            echo "Unsafe retire-then-reclaim model unexpectedly passed"; cat /tmp/unsafe-retired.log; exit 1
          fi
          grep -q "Invariant PinnedPresent is violated" /tmp/unsafe-retired.log || { cat /tmp/unsafe-retired.log; exit 1; }
          echo "PASS: a retired release still pinned by a reader cannot be collected"
