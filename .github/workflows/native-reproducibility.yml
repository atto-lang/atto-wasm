name: Independent native compiler and Wasm reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record and validate complete source tree
        run: bash scripts/verify-source-tree.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked compiler packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_native_toolchain_lock.py' -v
          read -r -a packages <<< "$(python3 scripts/verify-native-toolchain-lock.py install-args)"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          python3 scripts/verify-native-toolchain-lock.py verify
      - name: Independently compile native compiler from identical source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/fixtures/pinned-llvm -B build/source-llvm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/source-llvm --parallel 2
          test -x build/source-llvm/oreslang-llvmc
      - name: Independently compile and execute two sealed Wasm guests
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(realpath build/source-llvm/oreslang-llvmc)"
          sha="$(sha256sum "$compiler" | cut -d' ' -f1)"
          for spec in "examples/native-int.ores:42" "tests/fixtures/native-int-43.ores:43"; do
            src="${spec%:*}"
            expected="${spec##*:}"
            node scripts/compile-ores.mjs \
              "--compiler=$compiler" "--compiler-sha256=$sha" \
              "--source=$(realpath "$src")" \
              "--output=$PWD/build/repro-$expected.wasm" \
              "--clang=/usr/bin/clang" "--environment=browser" \
              "--publication=atomic"
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readAtomicRelease} from './scripts/atomic-release.mjs';
          for(const expected of [42n,43n]){
            const r=await readAtomicRelease('build/repro-'+expected+'.wasm');
            const actual=new WebAssembly.Instance(new WebAssembly.Module(r.wasm)).exports.main();
            assert.equal(actual,expected);
          }
          console.log('REPRO_GUESTS_EXECUTED_AND_VERIFIED');
          JS
      - name: Emit source- and artifact-bound reproducibility receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/record-native-repro.py ${{ matrix.replica }} build/native-repro
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-repro-${{ matrix.replica }}
          path: build/native-repro/native-${{ matrix.replica }}.json
          retention-days: 30
          if-no-files-found: error
  native-repro-compare:
    needs: native-rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify source tree before comparison
        run: bash scripts/verify-source-tree.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-repro-*
          path: build/independent
          merge-multiple: true
      - name: Compare independent compiler, Wasm, and toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess,hashlib
          folder=pathlib.Path('build/independent')
          if sorted(p.name for p in folder.iterdir())!=['native-a.json','native-b.json']:
              raise SystemExit('missing/extra independent rebuild attestation')
          a=json.loads((folder/'native-a.json').read_text())
          b=json.loads((folder/'native-b.json').read_text())
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          import re
          lock=hashlib.sha256(pathlib.Path('contracts/native-toolchain-ubuntu2404.lock.json').read_bytes()).hexdigest()
          if a.get('nativeToolchainLockSha256')!=lock or not isinstance(a.get('nativeCompilerSha256'),str) or not re.fullmatch(r'[0-9a-f]{64}',a['nativeCompilerSha256']):
              raise SystemExit('invalid host toolchain lock or compiler digest')
          if a!=b or a['sourceTree']!=tree:
              for key in sorted(set(a)|set(b)):
                  if a.get(key)!=b.get(key):
                      print('NONREPRODUCIBLE_FIELD',key,a.get(key),b.get(key))
              raise SystemExit('independent native compiler or Wasm build disagrees')
          if len(a['guests'])!=2 or [g['expectedI64'] for g in a['guests']]!=[42,43]:
              raise SystemExit('unexpected independent Wasm release evidence')
          print('PASS_INDEPENDENT_NATIVE_IDENTICAL',a['nativeCompilerSha256'])
          print('PASS_INDEPENDENT_SEALED_WASM_IDENTICAL',a['guests'])
          print('INDEPENDENT_REPRO_SOURCE_TREE',tree)
          PY

  native-oci-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prove checked-out source matches exact Git tree
        run: bash scripts/verify-source-tree.sh
      - name: Rebuild compiler in digest-pinned Ubuntu 24.04 amd64 container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci-${{ matrix.replica }}"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/oci-${{ matrix.replica }}:/out" \
            -e SOURCE_TREE="$source_tree" \
            -e REPLICA="${{ matrix.replica }}" \
            -w /src \
            docker.io/library/ubuntu@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends python3 lsb-release \
                zlib1g-dev libzstd-dev libedit-dev libcurl4-openssl-dev libxml2-dev \
                "build-essential=12.10ubuntu1" "cmake=3.28.3-1build7" \
                "clang=1:18.0-59~exp2" "lld=1:18.0-59~exp2" \
                "llvm-dev=1:18.0-59~exp2"
              python3 scripts/verify-native-toolchain-lock.py verify
              cmake -S tests/fixtures/pinned-llvm -B /tmp/ores-native-oci \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
              cmake --build /tmp/ores-native-oci --parallel 2
              python3 scripts/record-native-oci-repro.py \
                "$REPLICA" /tmp/ores-native-oci/oreslang-llvmc /out
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-oci-repro-${{ matrix.replica }}
          path: ${{ runner.temp }}/oci-${{ matrix.replica }}
          if-no-files-found: error
          retention-days: 30
  native-oci-compare:
    needs: native-oci-rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source tree
        run: bash scripts/verify-source-tree.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-oci-repro-*
          path: build/oci-compare
          merge-multiple: true
      - name: Compare independent digest-pinned OCI compiler and transitive graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          base=pathlib.Path('build/oci-compare')
          expected=['oci-a.json','oci-b.json','packages-a.txt','packages-b.txt']
          if sorted(p.name for p in base.iterdir())!=expected:
              raise SystemExit('missing/extra OCI reproducibility evidence')
          observations=[]
          for replica in ('a','b'):
              doc=json.loads((base/f'oci-{replica}.json').read_text())
              contents=(base/f'packages-{replica}.txt').read_bytes()
              if hashlib.sha256(contents).hexdigest()!=doc['installedDpkgGraphSha256']:
                  raise SystemExit('OCI package graph digest mismatch')
              if len(contents.splitlines())!=doc['installedDpkgCount']:
                  raise SystemExit('OCI package count mismatch')
              observations.append(doc)
          a,b=observations
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          lock=hashlib.sha256(pathlib.Path('contracts/native-toolchain-ubuntu2404.lock.json').read_bytes()).hexdigest()
          import re
          expected_base=('docker.io/library/ubuntu@sha256:'
              'f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b')
          digest=lambda value: isinstance(value,str) and bool(re.fullmatch(r'[0-9a-f]{64}',value))
          if not all(digest(a.get(key)) for key in (
              'nativeCompilerSha256','installedDpkgGraphSha256',
              'nativePackageLockSha256')) or a.get('baseImageManifest')!=expected_base:
              raise SystemExit('unrecognized native compiler digest, package graph or OCI base')
          if a!=b or a['sourceTree']!=tree or a['nativePackageLockSha256']!=lock:
              print('OCI_A',a)
              print('OCI_B',b)
              raise SystemExit('digest-pinned OCI builds or source/graph identities disagree')
          print('PASS_INDEPENDENT_DIGEST_PINNED_OCI_COMPILER',a['nativeCompilerSha256'])
          print('PASS_INDEPENDENT_OCI_PACKAGE_GRAPH',a['installedDpkgGraphSha256'])
          print('OCI_REPRO_SOURCE_GIT_TREE',tree)
          PY
