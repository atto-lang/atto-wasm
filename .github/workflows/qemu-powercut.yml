name: QEMU ext4 cold-boot atomic publication qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-powercut:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify complete source tree
        run: bash scripts/verify-source-tree.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reject forged or incomplete guest recovery transcripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_qemu_recovery_receipts.py' -v
      - name: Install version-locked fixture Clang and disposable QEMU guest kernel
        shell: bash
        run: |
          set -euo pipefail
          read -r -a packages <<< "$(python3 scripts/verify-native-toolchain-lock.py install-args clang lld)"
          sudo apt-get update
          # Preserve the reviewed GA-kernel allowlist while selecting actual
          # signed image artifacts. Never float to latest, HWE or the host kernel.
          kernel_package=''
          kernel_package_version=''
          for candidate in 6.8.0-147.147 6.8.0-146.146 6.8.0-139.139; do
            package="linux-image-${candidate%.*}-generic"
            available="$(apt-cache madison "$package" | awk -F '|' '{gsub(/^ +| +$/, "", $2); print $2}')"
            if printf '%s\n' "$available" | grep -Fxq "$candidate"; then
              kernel_package="$package"
              kernel_package_version="$candidate"
              break
            fi
          done
          if [ -z "$kernel_package" ]; then
            echo "::error::No reviewed signed QEMU guest kernel available in apt" >&2
            apt-cache policy linux-image-6.8.0-147-generic linux-image-6.8.0-146-generic linux-image-6.8.0-139-generic
            exit 1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "${packages[@]}" qemu-system-x86 busybox-static e2fsprogs initramfs-tools \
            "$kernel_package=$kernel_package_version"
          python3 scripts/verify-native-toolchain-lock.py verify clang lld
          test "$(dpkg-query -W -f='${Version}' "$kernel_package")" = "$kernel_package_version"
          # A signed linux-image-6.8.0-N-generic package supplies the same ABI name.
          guest_kernel="${kernel_package_version%.*}-generic"
          test -s "/boot/vmlinuz-$guest_kernel"
          test -s "/boot/initrd.img-$guest_kernel"
          echo "QEMU_KERNEL_APT_PACKAGE=$kernel_package=$kernel_package_version"
          echo "QEMU_KERNEL_VERSION=$guest_kernel"
          # The initramfs is runner-built and not an immutable Ubuntu package.
          # Persist its exact name and hash for this checkout/run's evidence.
          echo "QEMU_INITRD_PATH=/boot/initrd.img-$guest_kernel" >> "$GITHUB_ENV"
          # Ubuntu kernel files are root-readonly (0600).
          sudo cp "/boot/vmlinuz-$guest_kernel" "$RUNNER_TEMP/ores-qemu-vmlinuz"
          sudo chmod 0644 "$RUNNER_TEMP/ores-qemu-vmlinuz"
          echo "QEMU_KERNEL_SHA256=$(sha256sum "$RUNNER_TEMP/ores-qemu-vmlinuz" | cut -d' ' -f1)"
          echo "QEMU_INITRD_SHA256=$(sha256sum "/boot/initrd.img-$guest_kernel" | cut -d' ' -f1)"
      - name: Verify five single-publisher and two multi-publisher abrupt VM cold boots
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qemu-powercut-harness.py \
            "$RUNNER_TEMP/ores-qemu-vmlinuz" "$QEMU_INITRD_PATH"
          python3 -m json.tool build/qemu-powercut-evidence.json > /dev/null
          python3 - <<'PY'
          import json,pathlib,subprocess
          info=json.loads(pathlib.Path('build/qemu-powercut-evidence.json').read_text())
          wanted=['__testAfterReleaseRename','__testAfterReleaseInstall',
                  '__testBeforePointerRename','__testAfterPointerRename','__testBeforeCleanup']
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          if info.get('sourceTree')!=tree or info.get('checkpoints')!=wanted or (
              info.get('verifiedColdBoots')!=5 or info.get('uncleanHypervisorStops')!=5) or (
              info.get('multiWriterCases')!=['multi2','multi3'] or info.get('multiWriterColdBoots')!=2):
              raise SystemExit('QEMU evidence mismatches exact source or five single/two multi-writer cold boots')
          print('PASS_QEMU_FINAL_EVIDENCE_EXACT_TREE',tree)
          PY
          sha256sum build/qemu-powercut-evidence.json
      - name: Preserve observed VM power-cut qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-powercut-evidence
          path: build/qemu-powercut-evidence.json
          if-no-files-found: warn
          retention-days: 30

