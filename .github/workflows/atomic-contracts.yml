name: Atomic release JSON Schema and TypeSpec conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  atomic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install wasm32 compiler and schema verifier
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python3 -m pip install --break-system-packages 'jsonschema==4.25.1'
      - name: Compile real Wasm from fixture LLVM and seal an atomic release
        run: node scripts/generate-atomic-contract-fixtures.mjs "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Validate actual pointer, seal, manifest and provenance with JSON Schema
        run: python3 scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Emit and validate the TypeSpec release schema
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm ls --depth=0 '@typespec/compiler' '@typespec/json-schema'
          npm audit --audit-level=moderate
          mkdir -p build/atomic-typespec-emitted
          npx --no-install tsp compile contracts/atomic-release.tsp \
            --emit=@typespec/json-schema \
            --output-dir=build/atomic-typespec-emitted \
            --option '@typespec/json-schema.file-type=json' \
            --option '@typespec/json-schema.emitAllModels=true' \
            --option '@typespec/json-schema.seal-object-schemas=true'
      - name: Inspect generated TypeSpec schemas
        run: |
          find build/atomic-typespec-emitted -type f -print
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("build/atomic-typespec-emitted")
          for path in sorted(root.rglob("*.json")):
              doc=json.loads(path.read_text())
              print("EMITTED_SCHEMA_FILE",str(path), "keys", list(doc)[:20],
                    "defs", list(doc.get("$defs",{}))[:25],
                    "id",doc.get("$id"))
          PY
      - name: Differential conformance of normative and emitted JSON Schema
        run: python3 scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures" build/atomic-typespec-emitted
