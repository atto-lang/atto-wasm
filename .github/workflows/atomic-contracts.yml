name: Atomic release JSON Schema and TypeSpec conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  atomic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pristine Git checkout and record complete tree identity
        shell: bash
        run: bash scripts/verify-source-tree.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.15'
      - name: Install wasm32 compiler toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install SHA-256 hash-locked Python schema verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/atomic-schema-venv"
          "$RUNNER_TEMP/atomic-schema-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --require-hashes \
            -r contracts/python-requirements.lock
          "$RUNNER_TEMP/atomic-schema-venv/bin/python" -m pip check
          "$RUNNER_TEMP/atomic-schema-venv/bin/python" -c 'import jsonschema; from jsonschema import Draft202012Validator; print("HASHED_JSONSCHEMA_VERIFIER_OK",len(Draft202012Validator.VALIDATORS))'
      - name: Compile real Wasm from fixture LLVM and seal an atomic release
        run: node scripts/generate-atomic-contract-fixtures.mjs "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Validate actual pointer, seal, manifest and provenance with JSON Schema
        run: "$RUNNER_TEMP/atomic-schema-venv/bin/python" scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Emit and validate the TypeSpec release schema
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm ls --depth=0 '@typespec/compiler' '@typespec/json-schema'
          npm audit --audit-level=moderate
          mkdir -p build/atomic-typespec-emitted
          npx --no-install tsp compile contracts/atomic-release.tsp \
            --emit=@typespec/json-schema \
            --output-dir=build/atomic-typespec-emitted \
            --option '@typespec/json-schema.file-type=json' \
            --option '@typespec/json-schema.emitAllModels=true' \
            --option '@typespec/json-schema.seal-object-schemas=true'
      - name: Inspect generated TypeSpec schemas
        run: |
          find build/atomic-typespec-emitted -type f -print
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("build/atomic-typespec-emitted")
          for path in sorted(root.rglob("*.json")):
              doc=json.loads(path.read_text())
              print("EMITTED_SCHEMA_FILE",str(path), "keys", list(doc)[:20],
                    "defs", list(doc.get("$defs",{}))[:25],
                    "id",doc.get("$id"))
          PY
      - name: Differential conformance of normative and emitted JSON Schema
        run: "$RUNNER_TEMP/atomic-schema-venv/bin/python" scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures" build/atomic-typespec-emitted
