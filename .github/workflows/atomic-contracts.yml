name: Atomic release JSON Schema and TypeSpec conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  atomic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm32 compiler and schema verifier
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python3 -m pip install --break-system-packages 'jsonschema==4.25.1'
      - name: Compile real Wasm from fixture LLVM and seal an atomic release
        run: node scripts/generate-atomic-contract-fixtures.mjs "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Validate actual pointer, seal, manifest and provenance with JSON Schema
        run: python3 scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures"
      - name: Emit and validate the TypeSpec release schema
        run: |
          npm install --no-save --package-lock=false '@typespec/compiler@1.4.0' '@typespec/json-schema@1.4.0'
          npx tsp compile contracts/atomic-release.tsp \
            --emit=@typespec/json-schema \
            --output-dir="$RUNNER_TEMP/atomic-typespec-emitted" \
            --option '@typespec/json-schema.file-type=json' \
            --option '@typespec/json-schema.bundleId=https://oreslang.dev/schemas/atomic-typespec-bundle.json' \
            --option '@typespec/json-schema.seal-object-schemas=true'
      - name: Differential conformance of normative and emitted JSON Schema
        run: python3 scripts/verify-atomic-contracts.py "$RUNNER_TEMP/atomic-contract-fixtures" "$RUNNER_TEMP/atomic-typespec-emitted"
